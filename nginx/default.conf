# Configuración de nginx del proyecto. La monta docker-compose.override.yml.
# Toda la página es el panel del operador: login y proxy al backend, que solo
# existe en la red interna de Compose.
server {
    listen       80;
    listen  [::]:80;
    server_name  localhost;

    location / {
        auth_basic           "Panel del operador";
        auth_basic_user_file /etc/nginx/panel.htpasswd;
        proxy_pass           http://panel:8080;
        proxy_set_header     X-Remote-User $remote_user;   # reemplaza cualquier valor que mande el navegador
        proxy_set_header     Host $host;
        proxy_read_timeout   60s;
    }

    # La dirección anterior del panel sigue funcionando.
    location /panel { return 301 /; }

    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root     /usr/share/nginx/html;
        internal;
    }
}
