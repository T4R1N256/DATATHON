# Configuración de nginx del proyecto: la misma que trae nginx:alpine, más /panel/.
# La monta docker-compose.override.yml; el sitio de / sigue igual.
server {
    listen       80;
    listen  [::]:80;
    server_name  localhost;

    location / {
        root   /usr/share/nginx/html;
        index  index.html index.htm;
    }

    # Panel del operador: login y proxy al backend, que solo existe en la red interna de Compose.
    location = /panel { return 301 /panel/; }

    location /panel/ {
        auth_basic           "Panel del operador";
        auth_basic_user_file /etc/nginx/panel.htpasswd;
        proxy_pass           http://panel:8080/;
        proxy_set_header     X-Remote-User $remote_user;   # reemplaza cualquier valor que mande el navegador
        proxy_set_header     Host $host;
        proxy_read_timeout   60s;
    }

    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   /usr/share/nginx/html;
    }
}
