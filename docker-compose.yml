services:
  web:
    image: nginx:alpine
    ports:
      - "80:80"        # cambia el primer número por el puerto público que te dio el portal
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/panel.htpasswd:/etc/nginx/panel.htpasswd:ro
    depends_on:
      - panel
    restart: unless-stopped

  panel:
    image: python:3.12-slim
    user: "1000:1000"          # sin root; es el uid de linux1
    working_dir: /app
    command: ["python", "-u", "panel_web/servidor.py"]
    environment:
      EVENTOS_DIR: /eventos
      PANEL_HOST: 0.0.0.0      # solo dentro de la red de Compose: no publica puertos
      PANEL_PORT: "8080"
    volumes:
      - ./panel:/app/panel:ro
      - ./panel_web:/app/panel_web:ro
      - ${EVENTOS_HOST:-./eventos}:/eventos   # .env elige la carpeta; sin valor, los eventos reales
    restart: unless-stopped
