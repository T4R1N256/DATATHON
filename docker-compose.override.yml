# Agrega el panel del operador sin tocar docker-compose.yml: Compose carga este archivo solo.
# Para quitar el panel: borra este archivo y corre `docker compose up -d --remove-orphans`.
services:
  web:
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/panel.htpasswd:/etc/nginx/panel.htpasswd:ro
    depends_on:
      - panel

  panel:
    image: python:3.12-slim
    user: "1000:1000"          # sin root; es el uid de linux1 (revísalo con `id -u`)
    working_dir: /app
    command: ["python", "-u", "panel_web/servidor.py"]
    environment:
      EVENTOS_DIR: /eventos
      PANEL_HOST: 0.0.0.0      # escucha solo dentro de la red de Compose: no publica puertos
      PANEL_PORT: "8080"
    volumes:
      - ./panel:/app/panel:ro
      - ./panel_web:/app/panel_web:ro
      - ${EVENTOS_HOST:-/home/linux1/datathon/eventos}:/eventos
    restart: unless-stopped
